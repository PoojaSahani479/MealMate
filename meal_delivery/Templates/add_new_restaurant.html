<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Restaurant</title>
</head>
<body>
    <form method="POST" action="{% url 'add_new_restaurant' %}">
        {% csrf_token %}
        <label for="name">Restaurant Name:</label> <br><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br><br>

        <label for="cuisine_type">Cuisine Type:</label>
        <input type="text" id="cuisine_type" name="cuisine_type" required><br><br>

        <label for="image">Restaurant Image:</label>
        <input type="file" id="image" name="image"><br><br>

        <label for="rating">Rating:</label>
        <input type="number" id="rating" name="rating" min="1" max="5" step="0.1"><br><br>
        
        <input type="submit" value="Add Restaurant">
</body>
</html>
