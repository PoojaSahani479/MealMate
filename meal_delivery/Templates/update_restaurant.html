<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurent</title>
</head>
<body>
    <h1> Update Restaunrent</h1>
    <form method="POST">
    {% csrf_token %}
    <label>Restaurent Name</label>
    <input type="text" name="restaurent_name" value="{{ restaurant.restaurent_name }}"><br><br>
    <label>Address</label>
    <input type="text" name="address" value="{{ restaurant.address }}"><br><br>
    <label>Restaurant Picture</label>
    <input type="text" name="restaurant_picture" value="{{ restaurant.restaurant_picture }}"><br><br>
    <label>Cuisine Type</label>
    <input type="text" name="cuisine_type" value="{{ restaurant.cuisine_type }}"><br><br>
    <label>Rating</label>
    <input type="text" name="rating" value="{{ restaurant.rating }}"><br><br>
    <input type="submit" value="Update">    
    </form>
</body>
</html>
